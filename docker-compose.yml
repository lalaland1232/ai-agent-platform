services:
  app:
    image : ai_platform:latest
    ports:
      - "8000:8000"
    env_file:
      - .env_docker
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=shiv
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_DB=ai_platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiv -d ai_platform"]
      interval: 10s
      timeout: 30s
      retries: 5
      
    volumes:
      - postgre_data:/var/lib/postgresql/data


volumes:
  postgre_data:
